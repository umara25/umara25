<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- STYLES_PLACEHOLDER -->
  <style>
    .bubble { fill: #e9e9eb; }
    a { fill: #0079ff; }
    text { fill: #242424; font-size: 18px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -0.02em; }
    .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"; }
    .typing-1 { opacity: 0; animation: fade-in-out 1.5s; }
    .msg-1 { animation: wait 1.7s, msg-1 0.2s 1.7s; }
    .typing-2 { opacity: 0; animation: wait 2.5s, fade-in-out 1.5s 2.5s; }
    .msg-2 { animation: wait 4.2s, msg-2 0.2s 4.2s; }
    .typing-3 { opacity: 0; animation: wait 5s, fade-in-out 1.5s 5s; }
    .msg-3 { animation: wait 6.7s, msg-3 0.2s 6.7s; }
    .typing-4 { opacity: 0; animation: wait 7.5s, fade-in-out 1.5s 7.5s; }
    .msg-4 { animation: wait 9.2s, msg-4 0.2s 9.2s; }
    .typing-5 { opacity: 0; animation: wait 10s, fade-in-out 1.5s 10s; }
    .msg-5 { animation: wait 11.7s, msg-5 0.2s 11.7s; }
    .typing-6 { opacity: 0; animation: wait 12.5s, fade-in-out 1.5s 12.5s; }
    .msg-6 { animation: wait 14.2s, msg-6 0.2s 14.2s; }
    @keyframes wait { 0%, 100% { opacity: 0; } }
    @keyframes fade-in-out { 0%, 100% { opacity: 0; } 25%, 90% { opacity: 1; } }
    @keyframes msg-1 { 0% { opacity: 0; transform: translate(10px, 5px); } 100% { opacity: 1; transform: translate(10px, 0); } }
    @keyframes msg-2 { 0% { opacity: 0; transform: translate(10px, 57px); } 100% { opacity: 1; transform: translate(10px, 52px); } }
    @keyframes msg-3 { 0% { opacity: 0; transform: translate(10px, 109px); } 100% { opacity: 1; transform: translate(10px, 104px); } }
    @keyframes msg-4 { 0% { opacity: 0; transform: translate(10px, 185px); } 100% { opacity: 1; transform: translate(10px, 180px); } }
    @keyframes msg-5 { 0% { opacity: 0; transform: translate(10px, 287px); } 100% { opacity: 1; transform: translate(10px, 282px); } }
    @keyframes msg-6 { 0% { opacity: 0; transform: translate(10px, 747px); } 100% { opacity: 1; transform: translate(10px, 742px); } }
    @media (prefers-color-scheme: dark) { .bubble { fill: #3b3b3d; } text { fill: #dcdcdc; } a { fill: #0c82f9; } }
  </style>
  
  <!-- Hi, I'm Umar -->
  <g transform="translate(10, 0)" class="msg-1 bubble">
    <rect width="133" height="42" rx="18" />
    <text x="15" y="27">Hi, I'm Umar</text>
  </g>

  <!-- typing 2 -->
  <g transform="translate(10, 52)" class="typing-2">
    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Location (Y=52) -->
  <g transform="translate(10, 52)" class="msg-2">
    <rect width="439" height="42" rx="18" class="bubble" />
    <text x="15" y="27">I live in Toronto, Ontario, Canada</text>
  </g>

  <!-- typing 3 -->
  <g transform="translate(10, 104)" class="typing-3">
    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Bio (Y=104) -->
  <g transform="translate(10, 104)" class="msg-3">
    <rect width="456" height="66" rx="18" class="bubble" />
    <text x="15" y="27">I am currently interning @ EcoClaim</text>
    <text x="15" y="50">and previously @ Meta</text>
  </g>

  <!-- typing 4 -->
  <g transform="translate(10, 180)" class="typing-4">
    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- PolyYield (Y=180) -->
  <g transform="translate(10, 180)" class="msg-4">
    <rect width="456" height="92" rx="18" class="bubble" />
    <text x="15" y="27">Check out PolyYield: https://polyyield.vercel.app/</text>
    <text x="15" y="50">No-lose prediction markets where</text>
    <text x="15" y="73">your principal is always protected.</text>
  </g>

  <!-- typing 5 -->
  <g transform="translate(10, 282)" class="typing-5">
    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Image Here (Y=282) -->
  <g transform="translate(10, 282)" class="msg-5">
    <!-- IMAGE_PLACEHOLDER -->
  </g>

  <!-- typing 6 -->
  <g transform="translate(10, 742)" class="typing-6">
    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" /></circle>
    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Footer (Y=742) -->
  <g transform="translate(10, 742)" class="msg-6">
    <rect width="245" height="42" rx="18" class="bubble" />
    <text x="15" y="27">Have a great {todayDay}!</text>  
  </g>
</svg>
